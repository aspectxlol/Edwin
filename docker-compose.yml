services:
  edwin:
    build:
      context: .
      # File is lowercase "dockerfile" — keep in sync on case-sensitive FS.
      dockerfile: dockerfile
    container_name: edwin
    restart: unless-stopped

    # tini is in the image; init: true is a belt-and-braces fallback.
    init: true

    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      # Baileys session — persists the WhatsApp login across deploys.
      - edwin-auth:/app/auth
      - edwin-data:/app/data

    healthcheck:
      # The bot is a WhatsApp client, not a server; verify the process
      # is alive and the Node event loop is responsive.
      test: ["CMD", "node", "-e", "process.stdout.write('ok'); process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # No ports exposed: the bot is a pure outbound WebSocket client.
    # Uncomment if you later add a web dashboard / webhook receiver.
    # ports:
    #   - "3000:3000"

  postgres:
    image: postgres:18-alpine
    container_name: edwin-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      # Postgres 18+ images: mount /var/lib/postgresql (NOT .../data).
      # Data lands in a versioned subdir (18/docker) for pg_upgrade compat.
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # DB is only reachable from inside the compose network.
    # Uncomment to inspect from the host with psql/gui tools.
    # ports:
    #   - "5432:5432"

volumes:
  edwin-auth:
  edwin-data:
  postgres-data:
